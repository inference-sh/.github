# Required on every PR into main, in every repo (org ruleset "Protect main
# branch", rule "workflows"). A leaked secret fails the PR; dependency
# findings (Trivy, govulncheck) are reported only, so old findings don't block
# promotion.
#
# Two secret scanners: Trivy reads the tree as it is, gitleaks reads every
# commit of the PR, so a secret added and removed again inside the PR is
# still caught. Pushes that never go through a PR (dev, bot branches) are
# covered by the secret sweep in the compliance repo.
name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: 1
          format: table

  gitleaks:
    name: secret scan (commits)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.toml" https://raw.githubusercontent.com/inference-sh/.github/main/gitleaks.toml
      - name: Scan the PR's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config "$RUNNER_TEMP/gitleaks.toml" \
            --log-opts="$BASE..$HEAD" --redact --no-banner --verbose --exit-code 1

  dependencies:
    name: dependency scan (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table

  # govulncheck reports only the known Go vulnerabilities the code can reach
  # (call graph), in every Go module of the repo, including the standard
  # library of the module's Go version. Report only, like the dependency scan:
  # findings show as a warning and in the job summary, the PR is not blocked.
  govulncheck:
    name: Go vulnerabilities (report only)
    runs-on: ubuntu-latest
    env:
      GOVULNCHECK_VERSION: v1.9.0
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find Go modules
        id: mods
        run: |
          mods=$(git ls-files | grep -E '(^|/)go\.mod$' | grep -vE '(^|/)(vendor|testdata)/' | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
          echo "dirs=$mods" >> "$GITHUB_OUTPUT"
          [ -n "$mods" ] || echo "No Go module in this repo." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.mods.outputs.dirs != ''
        with:
          go-version: stable
          cache: false
      - name: govulncheck
        if: steps.mods.outputs.dirs != ''
        env:
          DIRS: ${{ steps.mods.outputs.dirs }}
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          gvc="$(go env GOPATH)/bin/govulncheck"
          found=0
          for d in $DIRS; do
            echo "::group::$d"
            rc=0
            (cd "$d" && "$gvc" ./...) > "$RUNNER_TEMP/out.txt" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/out.txt"
            echo "::endgroup::"
            case $rc in
              0) echo "- \`$d\`: no reachable vulnerabilities" >> "$GITHUB_STEP_SUMMARY" ;;
              3) found=1
                 echo "::warning title=govulncheck::$d: reachable Go vulnerabilities (see the log)"
                 { echo "- \`$d\`: **reachable vulnerabilities**"; echo '```'; grep -E '^(Vulnerability #|[[:space:]]+(Found in|Fixed in):)' "$RUNNER_TEMP/out.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "::warning title=govulncheck::$d: govulncheck failed (exit $rc, see the log)"
                 echo "- \`$d\`: govulncheck failed (exit $rc)" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          done
          [ "$found" = 0 ] || echo "Reachable vulnerabilities found: update the module or the Go version named in 'Fixed in'."
