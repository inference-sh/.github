name: Trivy Container Scan

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t ${{ inputs.image-name }}:ci -f ${{ inputs.dockerfile }} .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.image-name }}:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table
